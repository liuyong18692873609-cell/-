<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星月写作 - AI智能创作平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Noto Sans SC"', 'system-ui', 'sans-serif'],
              serif: ['"Noto Serif SC"', 'serif'],
            },
            colors: {
              'paper': '#fdfbf7',
              'ink': '#2d2a2e',
              'primary': '#4f46e5', // Indigo 600
              'primary-light': '#e0e7ff', // Indigo 100
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #f3f4f6;
        color: #1f2937;
      }
      /* Custom scrollbar for a cleaner look */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      
      /* Markdown Styles for Chat */
      .markdown-body h1, .markdown-body h2, .markdown-body h3 {
        font-weight: bold;
        margin-top: 0.5em;
        margin-bottom: 0.3em;
        color: #1f2937;
      }
      .markdown-body h1 { font-size: 1.25em; }
      .markdown-body h2 { font-size: 1.1em; }
      .markdown-body h3 { font-size: 1em; }
      .markdown-body p { margin-bottom: 0.5em; }
      .markdown-body ul { list-style-type: disc; padding-left: 1.2em; margin-bottom: 0.5em; }
      .markdown-body ol { list-style-type: decimal; padding-left: 1.2em; margin-bottom: 0.5em; }
      .markdown-body strong { font-weight: 700; color: #111827; }
      .markdown-body em { font-style: italic; }
      .markdown-body blockquote { 
        border-left: 3px solid #e5e7eb; 
        padding-left: 0.8em; 
        color: #6b7280;
        margin-bottom: 0.5em;
      }
      .markdown-body code {
        background-color: #f3f4f6;
        padding: 0.1em 0.3em;
        border-radius: 0.2em;
        font-size: 0.9em;
        font-family: monospace;
      }
      .markdown-body pre {
        background-color: #f3f4f6;
        padding: 0.8em;
        border-radius: 0.4em;
        overflow-x: auto;
        margin-bottom: 0.5em;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-markdown": "https://esm.sh/react-markdown@9?bundle",
    "recharts": "https://esm.sh/recharts@2.15.0?external=react,react-dom"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
